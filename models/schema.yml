version: 2
models:
- name: stg_customers
  description: One row per per-order customer ID; stable identity is customer_unique_id.
  columns:
  - name: customer_id
    description: Unique model grain.
    data_tests:
    - not_null
    - unique
- name: stg_orders
  description: One row per order, all lifecycle states retained. Unknown delivery
    comparisons remain null.
  columns:
  - name: order_id
    description: Unique model grain.
    data_tests:
    - not_null
    - unique
  - name: ordered_at
    data_tests:
    - not_null
  - name: order_status
    data_tests:
    - accepted_values:
        arguments:
          values:
          - created
          - approved
          - invoiced
          - processing
          - shipped
          - delivered
          - canceled
          - unavailable
- name: stg_products
  description: One row per product; source spelling corrected and missing categories
    preserved.
  columns:
  - name: product_id
    description: Unique model grain.
    data_tests:
    - not_null
    - unique
- name: stg_sellers
  description: One row per seller; ZIP prefixes preserved as five-character text.
  columns:
  - name: seller_id
    description: Unique model grain.
    data_tests:
    - not_null
    - unique
- name: stg_geolocation
  description: One row per ZIP prefix; mean coordinates and deterministic modal city/state.
  columns:
  - name: zip_code_prefix
    description: Unique model grain.
    data_tests:
    - not_null
    - unique
- name: stg_product_category_translation
  description: One row per Portuguese category; incomplete translation coverage is
    expected.
  columns:
  - name: product_category_name_pt
    description: Unique model grain.
    data_tests:
    - not_null
    - unique
- name: dim_customers
  description: One row per stable customer, latest observed location, delivered-order
    payments in BRL.
  columns:
  - name: customer_unique_id
    description: Unique model grain.
    data_tests:
    - not_null
    - unique
- name: dim_products
  description: One row per product. Delivered sales only; reviews weighted once per
    product/order.
  columns:
  - name: product_id
    description: Unique model grain.
    data_tests:
    - not_null
    - unique
- name: dim_sellers
  description: One row per seller including sellers without delivered sales.
  columns:
  - name: seller_id
    description: Unique model grain.
    data_tests:
    - not_null
    - unique
- name: dim_dates
  description: One calendar day across observed purchases, inclusive; ISO weekdays
    1=Monday,7=Sunday.
  columns:
  - name: date
    description: Unique model grain.
    data_tests:
    - not_null
    - unique
- name: fct_orders
  description: One row per order. Pre-aggregated items, payments and reviews prevent
    fan-out. All statuses retained.
  columns:
  - name: order_id
    description: Unique model grain.
    data_tests:
    - not_null
    - unique
  - name: customer_unique_id
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('dim_customers')
          field: customer_unique_id
- name: mart_customer_lifetime_value
  description: One row per stable customer with delivered orders; historical value,
    not predicted CLV.
  columns:
  - name: customer_unique_id
    description: Unique model grain.
    data_tests:
    - not_null
    - unique
- name: mart_daily_revenue
  description: One calendar day, including zero-order days. Full rebuild supports
    arbitrary historical corrections.
  columns:
  - name: order_date
    description: Unique model grain.
    data_tests:
    - not_null
    - unique
- name: mart_seller_performance
  description: One row per seller with delivered sales; reviews/delivery rates at
    seller/order grain.
  columns:
  - name: seller_id
    description: Unique model grain.
    data_tests:
    - not_null
    - unique
- name: stg_order_items
  description: One row per composite key; preserve split records for aggregation.
  data_tests:
  - unique_combination:
      arguments:
        columns:
        - order_id
        - order_item_id
  columns:
  - name: order_id
    data_tests:
    - not_null
  - name: order_item_id
    data_tests:
    - not_null
- name: stg_order_payments
  description: One row per composite key; preserve split records for aggregation.
  data_tests:
  - unique_combination:
      arguments:
        columns:
        - order_id
        - payment_sequential
  columns:
  - name: order_id
    data_tests:
    - not_null
  - name: payment_sequential
    data_tests:
    - not_null
- name: stg_order_reviews
  description: One row per source review record; multiple reviews per order and reused
    review IDs are allowed.
  columns:
  - name: review_score
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values:
          - 1
          - 2
          - 3
          - 4
          - 5
          quote: false
