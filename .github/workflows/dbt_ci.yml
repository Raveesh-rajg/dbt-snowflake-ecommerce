name: dbt CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  local-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Full DAG, data tests, snapshot, docs and CSV exports
        run: python scripts/run_demo.py
      - name: Regression tests for joins, time windows, loader and history
        run: python -m pytest -q
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dbt-local-evidence
          path: |
            target/manifest.json
            target/run_results.json
            target/build_results.json
            target/catalog.json
            target/index.html
            data/exports/*.csv
          retention-days: 14
